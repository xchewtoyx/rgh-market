# Keep plugins/<name>/ vendored from the newest Cloudsmith package for each
# plugin, and .claude-plugin/marketplace.json's version field current with
# it. Cloudsmith's packages API and raw downloads are both anonymously
# readable for this public repo, so no credentials are needed here.
name: Sync marketplace

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Sync vendored plugins from Cloudsmith
        run: python3 scripts/sync_marketplace.py

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- plugins .claude-plugin/marketplace.json)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins .claude-plugin/marketplace.json
          git commit -m "Sync vendored plugins with latest Cloudsmith packages"
          git push origin HEAD:${{ github.ref_name }}
