name: Python tests

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - "plugins/**"
      - ".claude-plugin/**"
      - ".cursor-plugin/**"
      - ".github/workflows/python-tests.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - "plugins/**"
      - ".claude-plugin/**"
      - ".cursor-plugin/**"
      - ".github/workflows/python-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r plugins/bundle-curator/requirements.txt

      - name: Check Cursor catalogs match the Claude marketplace
        run: python3 scripts/cursor_catalog.py --check

      - name: Run tests
        run: pytest tests/ plugins/bundle-curator/tests/ -v
